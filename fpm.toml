[extra.ford]
project = "GRAMSES"
summary = "Numerical relativity N-body simulations in cosmology based on RAMSES"
author = "Cristian Barrera-Hinojosa and Baojiu Li. RAMSES has been developed by R. Teyssier"
project_github = "https://github.com/crisbh/gramses"
# Only the directories compiled into bin/ramses3d (see VPATH in bin/Makefile)
src_dir = ["amr","hydro","pm","poisson"]
# GR test variants of amr_step (not built) and the GRACKLE-only module (needs grackle.def)
exclude = ["amr/amr_step_*_test.f90", "hydro/grackle_parameters.F"]
page_dir = "docs/pages"
output_dir = "docs/_site"
graph = true
search = false
docmark = "!"
predocmark = ">"
# Sources are lowercase .f90, which FORD does not preprocess by default
preprocess = true
fpp_extensions = ["f90","F90","F"]
# Defaults from bin/Makefile
macro = ["NDIM=3","NVECTOR=64","NPRE=8","NVAR=5","NENER=0","SOLVERhydro"]
extensions = ["f90","f95","F90","F95"]
md_extensions = ["markdown.extensions.tables","markdown.extensions.fenced_code","markdown.extensions.toc"]
